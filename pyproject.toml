[build-system]
requires = ["hatchling>=1.12.2"]
build-backend = "hatchling.build"

[project]
name = "conda-dev-request-headers"
version = "0.1.0"
description = "Development-only conda plugin for injecting scoped HTTP request headers"
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Archiving :: Packaging",
]
dependencies = [
  # Required at runtime, but conda is distributed through conda channels rather
  # than PyPI. Keep it in pixi/recipe metadata instead of declaring a PyPI dep.
  # "conda >=26.3",
]

[project.urls]
repository = "https://github.com/jezdez/conda-dev-request-headers"

[project.entry-points.conda]
"conda-dev-request-headers" = "conda_dev_request_headers.plugin"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
show_missing = true
skip_covered = true
sort = "Miss"

[tool.coverage.run]
source = ["conda_dev_request_headers"]
branch = true

[tool.ruff]
target-version = "py310"
exclude = [".pixi"]

[tool.ruff.lint]
flake8-type-checking = {exempt-modules = [], strict = true}
select = [
  "E",       # pycodestyle errors
  "F",       # pyflakes
  "FA",      # flake8-future-annotations
  "I",       # isort
  "ISC",     # flake8-implicit-str-concat
  "RUF100",  # unused noqa directive
  "T10",     # flake8-debugger
  "TCH",     # flake8-type-checking
  "UP",      # pyupgrade
  "W",       # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ty.environment]
python-version = "3.10"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.10"
conda = ">=26.3"

[tool.pixi.pypi-dependencies]
conda-dev-request-headers = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.9"
ty = ">=0.0.1a7"
pre-commit = ">=4.0"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.0"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
dev = {features = ["dev"], solve-group = "default"}
test = {features = ["test"], solve-group = "default"}
test-py310 = {features = ["test", "py310"], solve-group = "test-py310"}
test-py311 = {features = ["test", "py311"], solve-group = "test-py311"}
test-py312 = {features = ["test", "py312"], solve-group = "test-py312"}
test-py313 = {features = ["test", "py313"], solve-group = "test-py313"}
test-py314 = {features = ["test", "py314"], solve-group = "test-py314"}

[tool.pixi.tasks]
lint = { cmd = "ruff check conda_dev_request_headers tests", description = "Check code style" }
format = { cmd = "ruff format conda_dev_request_headers tests", description = "Auto-format code" }
format-check = { cmd = "ruff format --check conda_dev_request_headers tests", description = "Verify formatting" }
typecheck = { cmd = "ty check conda_dev_request_headers", description = "Run type checker" }
test = { cmd = "pytest", description = "Run test suite" }
test-cov = { cmd = "pytest --cov --cov-report=term-missing --cov-report=xml", description = "Tests with coverage" }

[tool.pixi.tasks.check]
depends-on = ["lint", "format-check", "typecheck", "test"]
description = "Run all checks"
